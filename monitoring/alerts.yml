groups:
  - name: booking-service-sli
    rules:
      - alert: BookingSuccessUnderOneSecondBelowTarget
        expr: |
          (
            sum(rate(booking_requests_total{outcome="success_under_1s"}[5m]))
            /
            sum(rate(booking_requests_total[5m]))
          ) < 0.999
          and
          sum(rate(booking_requests_total[5m])) > 0
        for: 10m
        labels:
          severity: warning
          service: booking-service
        annotations:
          summary: "Booking SLI is below the 99.9% target"
          description: "Fewer than 99.9% of observed booking requests are succeeding in under one second over the recent window. Check traffic, errors and latency."
          runbook_url: "https://github.com/sarathvictor/tdb-devops-handson/blob/main/monitoring/runbooks/booking-availability.md"
      - alert: BookingFailuresOrSlowResponsesElevated
        expr: |
          (
            1 -
            (
              sum(rate(booking_requests_total{outcome="success_under_1s"}[30m]))
              /
              sum(rate(booking_requests_total[30m]))
            )
          ) > 0.005
          and
          sum(rate(booking_requests_total[30m])) > 0
        for: 10m
        labels:
          severity: critical
          service: booking-service
        annotations:
          summary: "Booking error budget is burning quickly"
          description: "More than 0.5% of booking requests are failing or taking at least one second over the recent window."
          runbook_url: "https://github.com/sarathvictor/tdb-devops-handson/blob/main/monitoring/runbooks/booking-availability.md"
