
name: DevOps Hands-on CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest httpx

      - name: Run tests
        run: python -m pytest -v

  container-scan:
    name: Docker Build and Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t booking-service:${{ github.sha }} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: booking-service:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  publish:
    name: Publish Image to GHCR
    runs-on: ubuntu-latest
    needs:
      - test
      - container-scan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

  helm-validate:
    name: Helm Chart Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Lint Helm chart
        run: helm lint helm/booking-service

      - name: Validate development values
        run: |
          helm template booking-service helm/booking-service \
            --values helm/booking-service/values-dev.yaml

      - name: Validate production values
        run: |
          helm template booking-service helm/booking-service \
            --values helm/booking-service/values-prod.yaml

  terraform-validate:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Initialize and validate Terraform configurations
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            dir="$(dirname "$file")"
            echo "Validating: $dir"

            terraform -chdir="$dir" init \
              -backend=false \
              -input=false \
              -no-color

            terraform -chdir="$dir" validate -no-color
          done < <(find terraform -type f -name '*.tf' -print0 \
            | while IFS= read -r -d '' file; do
                dirname "$file"
              done \
            | sort -u \
            | while IFS= read -r dir; do
                find "$dir" -maxdepth 1 -type f -name '*.tf' -print0
              done)

  prometheus-rules:
    name: Prometheus Alert Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate alert rules
        run: |
          docker run --rm \
            -v "$PWD/monitoring:/etc/prometheus:ro" \
            prom/prometheus:v2.53.0 \
            promtool check rules /etc/prometheus/alerts.yml
